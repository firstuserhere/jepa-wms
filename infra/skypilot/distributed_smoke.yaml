name: jepawm-distributed-recovery-smoke
# Two nodes are intentional: exercise the provider network and cross-node
# NCCL rendezvous, not only eight local GPUs.
num_nodes: 2

resources:
  cloud: gcp
  accelerators: H200:8
  cpus: 128+
  memory: 1000+
  disk_size: 512
  disk_tier: best
  network_tier: best
  use_spot: true
  job_recovery:
    strategy: EAGER_NEXT_REGION
    max_restarts_on_errors: 2
    recover_on_exit_codes: [42]

workdir: .

envs:
  CHECKPOINT_STORE_URI: gs://replace-me-jepawm-checkpoints
  NCCL_ASYNC_ERROR_HANDLING: "1"
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
  PYTHONUNBUFFERED: "1"
  WANDB_MODE: online
  WANDB_PROJECT: vjepa_wm

secrets:
  - secrets:HF_TOKEN
  - secrets:WANDB_API_KEY

file_mounts:
  /mnt/jepawm-checkpoints:
    source: ${CHECKPOINT_STORE_URI}
    mode: MOUNT_CACHED
    type: MODEL_CHECKPOINT_RW
    persistent: true
    config:
      mount_cached:
        vfs_write_back: 0s
        vfs_cache_max_size: 200G

setup: |
  bash infra/skypilot/setup_smoke.sh

run: |
  set -euo pipefail
  export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
  export JEPAWM_RUN_ID="${JEPAWM_RUN_ID:-${SKYPILOT_TASK_ID:?SKYPILOT_TASK_ID is required}}"
  if [[ ! "$JEPAWM_RUN_ID" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]]; then
    echo "JEPAWM_RUN_ID is not filesystem-safe" >&2
    exit 2
  fi
  master_addr="$(printf '%s\n' "$SKYPILOT_NODE_IPS" | sed -n '1p')"
  test -n "$master_addr"
  uv run --no-sync torchrun \
    --nnodes="$SKYPILOT_NUM_NODES" \
    --nproc_per_node="$SKYPILOT_NUM_GPUS_PER_NODE" \
    --node_rank="$SKYPILOT_NODE_RANK" \
    --master_addr="$master_addr" \
    --master_port=29600 \
    --max_restarts=0 \
    -m app.torchrun \
    --smoke \
    --smoke-state "/mnt/jepawm-checkpoints/smoke/$JEPAWM_RUN_ID/distributed_recovery.json" \
    --smoke-fail-once \
    --recovery-exit-code 42 \
    --expected-gpu H200 \
    --expected-num-nodes 2 \
    --wandb-project "$WANDB_PROJECT" \
    --require-env HF_TOKEN \
    --require-env WANDB_API_KEY
