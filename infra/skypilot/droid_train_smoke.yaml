name: jepawm-droid-dinov3-train-smoke
# Exercise the actual DINO + DROID + predictor gradient path across nodes,
# including all-rank RNG/sampler checkpoint collection and managed recovery.
num_nodes: 2

resources:
  cloud: gcp
  accelerators: H200:8
  cpus: 128+
  memory: 1000+
  disk_size: 512
  disk_tier: best
  network_tier: best
  use_spot: true
  job_recovery:
    strategy: EAGER_NEXT_REGION
    max_restarts_on_errors: 3
    recover_on_exit_codes: [42]

workdir: .

envs:
  CHECKPOINT_STORE_URI: gs://replace-me-jepawm-checkpoints
  DROID_STORE_URI: gs://replace-me-jepawm-datasets
  NCCL_ASYNC_ERROR_HANDLING: "1"
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
  PYTHONUNBUFFERED: "1"
  WANDB_MODE: online
  WANDB_PROJECT: vjepa_wm
  DINOV3_WEIGHTS_URI: gs://replace-with-verified-original-pth
  DINOV3_WEIGHTS_SHA256: REPLACE_WITH_FULL_SHA256
  JEPAWM_DISTRIBUTED_SMOKE_RUN_ID: REPLACE_WITH_DISTRIBUTED_SMOKE_RUN_ID
  JEPAWM_RESUME: "0"

secrets:
  - secrets:HF_TOKEN
  - secrets:WANDB_API_KEY

file_mounts:
  /mnt/jepawm-datasets:
    source: ${DROID_STORE_URI}
    mode: MOUNT_CACHED
    type: DATASET_RO
    persistent: true
    config:
      mount_cached:
        vfs_cache_max_size: 2500G
        vfs_cache_max_age: 24h
  /mnt/jepawm-checkpoints:
    source: ${CHECKPOINT_STORE_URI}
    mode: MOUNT_CACHED
    type: MODEL_CHECKPOINT_RW
    persistent: true
    config:
      mount_cached:
        vfs_write_back: 0s
        vfs_cache_max_size: 200G

setup: |
  bash infra/skypilot/setup_training.sh

run: |
  set -euo pipefail
  export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
  export JEPAWM_HOME="$PWD"
  export JEPAWM_DSET=/mnt/jepawm-datasets
  export JEPAWM_LOGS=/mnt/jepawm-checkpoints/runs
  export JEPAWM_CKPT=/mnt/jepawm-checkpoints/checkpoints
  export JEPAWM_OSSCKPT="$PWD/.artifacts"
  export JEPAWM_RUN_ID="${JEPAWM_RUN_ID:-${SKYPILOT_TASK_ID:?SKYPILOT_TASK_ID is required}}"
  if [[ ! "$JEPAWM_RUN_ID" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]]; then
    echo "JEPAWM_RUN_ID is not filesystem-safe" >&2
    exit 2
  fi
  if [[ "${JEPAWM_RESUME:-0}" != 0 && "${JEPAWM_RESUME:-0}" != 1 ]]; then
    echo "JEPAWM_RESUME must be 0 or 1" >&2
    exit 2
  fi
  if [[ ! "${JEPAWM_DISTRIBUTED_SMOKE_RUN_ID:-}" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]]; then
    echo "JEPAWM_DISTRIBUTED_SMOKE_RUN_ID must identify the completed cross-node smoke" >&2
    exit 2
  fi
  resume_args=()
  [[ "${JEPAWM_RESUME:-0}" == 1 ]] && resume_args=(--resume-existing)
  export DINOV3_REPO_PATH="$PWD/dinov3"
  export DINOV3_WEIGHTS_PATH="$PWD/.artifacts/dinov3/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth"
  test -s "$JEPAWM_DSET/DROID/droid_paths.csv"
  test -s "$JEPAWM_DSET/DROID/droid_manifest.json"
  test -d "$JEPAWM_DSET/droid_raw/1.0.1"
  test -d "$JEPAWM_DSET/franka_custom"
  master_addr="$(printf '%s\n' "$SKYPILOT_NODE_IPS" | sed -n '1p')"
  test -n "$master_addr"
  set +e
  uv run --no-sync torchrun \
    --nnodes="$SKYPILOT_NUM_NODES" \
    --nproc_per_node="$SKYPILOT_NUM_GPUS_PER_NODE" \
    --node_rank="$SKYPILOT_NODE_RANK" \
    --master_addr="$master_addr" \
    --master_port=29600 \
    --max_restarts=0 \
    -m app.torchrun \
    --fname infra/skypilot/droid_dinov3_smoke_overlay.yaml \
    --checkpoint-recovery-smoke \
    --smoke-stop-after-epoch 1 \
    --smoke-verify-epoch 2 \
    --recovery-exit-code 42 \
    "${resume_args[@]}" \
    --require-env HF_TOKEN \
    --require-env WANDB_API_KEY
  torchrun_status=$?
  set -e
  probe_state="$JEPAWM_CKPT/$JEPAWM_RUN_ID/run_metadata/training_recovery_smoke.json"
  if ((torchrun_status != 0)) && python3 - "$probe_state" <<'PY'
  import json
  import sys

  try:
      with open(sys.argv[1], "r", encoding="utf-8") as stream:
          state = json.load(stream)
  except (FileNotFoundError, json.JSONDecodeError):
      raise SystemExit(1)
  raise SystemExit(0 if state.get("phase") == "armed" else 1)
  PY
  then
    exit 42
  fi
  if ((torchrun_status == 0)) && [[ "$SKYPILOT_NODE_RANK" == 0 ]]; then
    distributed_state="/mnt/jepawm-checkpoints/smoke/$JEPAWM_DISTRIBUTED_SMOKE_RUN_ID/distributed_recovery.json"
    if ! uv run --no-sync python infra/skypilot/runtime_readiness.py publish \
      --distributed-smoke "$distributed_state" \
      --training-smoke "$probe_state" \
      --training-checkpoint-root "$JEPAWM_CKPT/$JEPAWM_RUN_ID" \
      --dataset-manifest "$JEPAWM_DSET/DROID/droid_manifest.json" \
      --dinov3-weights "$DINOV3_WEIGHTS_PATH" \
      --git-commit "$GIT_COMMIT_HASH" \
      --output "$JEPAWM_CKPT/$JEPAWM_RUN_ID/run_metadata/RUNTIME_READY.json"; then
      # The expensive smoke is already terminal and app.torchrun treats that
      # state idempotently; code 42 asks managed recovery to retry publication.
      exit 42
    fi
  fi
  exit "$torchrun_status"
