name: jepawm-droid-dinov3-mfu-box
num_nodes: 1

resources:
  cloud: gcp
  accelerators: H200:8
  cpus: 128+
  memory: 1000+
  disk_size: 512
  disk_tier: best
  network_tier: best
  use_spot: true
  job_recovery:
    strategy: EAGER_NEXT_REGION
    max_restarts_on_errors: 3

workdir: .

envs:
  CHECKPOINT_STORE_URI: gs://replace-me-jepawm-checkpoints
  DROID_STORE_URI: gs://replace-me-jepawm-datasets
  NCCL_ASYNC_ERROR_HANDLING: "1"
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
  PYTHONUNBUFFERED: "1"
  WANDB_MODE: online
  WANDB_PROJECT: vjepa_wm
  DINOV3_WEIGHTS_URI: gs://replace-with-verified-original-pth
  DINOV3_WEIGHTS_SHA256: REPLACE_WITH_FULL_SHA256
  JEPAWM_RESUME: "0"

secrets:
  - secrets:HF_TOKEN
  - secrets:WANDB_API_KEY

file_mounts:
  /mnt/jepawm-datasets:
    source: ${DROID_STORE_URI}
    mode: MOUNT_CACHED
    type: DATASET_RO
    persistent: true
    config:
      mount_cached:
        vfs_cache_max_size: 2500G
        vfs_cache_max_age: 24h
  /mnt/jepawm-checkpoints:
    source: ${CHECKPOINT_STORE_URI}
    mode: MOUNT_CACHED
    type: MODEL_CHECKPOINT_RW
    persistent: true
    config:
      mount_cached:
        vfs_write_back: 0s
        vfs_cache_max_size: 200G

setup: |
  bash infra/skypilot/setup_training.sh

run: |
  set -euo pipefail
  export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
  export JEPAWM_HOME="$PWD"
  export JEPAWM_DSET=/mnt/jepawm-datasets
  : "${PANTHEON_USER:?PANTHEON_USER is required}"
  : "${EXPERIMENT_TAG:?EXPERIMENT_TAG is required}"
  : "${JEPAWM_PANTHEON_ROOT:?JEPAWM_PANTHEON_ROOT is required}"
  export JEPAWM_LOGS="$JEPAWM_PANTHEON_ROOT/runs"
  export JEPAWM_CKPT="$JEPAWM_PANTHEON_ROOT/checkpoints"
  export JEPAWM_OSSCKPT="$PWD/.artifacts"
  export JEPAWM_RUN_ID="${JEPAWM_RUN_ID:-$EXPERIMENT_TAG}"
  [[ "$JEPAWM_RUN_ID" == "$EXPERIMENT_TAG" ]] || {
    echo "JEPAWM_RUN_ID must equal EXPERIMENT_TAG" >&2
    exit 2
  }
  mkdir -p "$JEPAWM_LOGS" "$JEPAWM_CKPT"
  chmod 777 "$JEPAWM_PANTHEON_ROOT" "$JEPAWM_LOGS" "$JEPAWM_CKPT"
  export DINOV3_REPO_PATH="$PWD/dinov3"
  export DINOV3_WEIGHTS_PATH="$PWD/.artifacts/dinov3/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth"
  test -s "$JEPAWM_DSET/DROID/droid_paths.csv"
  test -s "$JEPAWM_DSET/DROID/droid_manifest.json"
  test -d "$JEPAWM_DSET/droid_raw/1.0.1"
  test -d "$JEPAWM_DSET/franka_custom"
  master_addr="$(printf '%s\n' "$SKYPILOT_NODE_IPS" | sed -n '1p')"
  test -n "$master_addr"
  uv run --no-sync torchrun \
    --nnodes=1 \
    --nproc_per_node="$SKYPILOT_NUM_GPUS_PER_NODE" \
    --node_rank=0 \
    --master_addr="$master_addr" \
    --master_port=29600 \
    --max_restarts=0 \
    -m app.torchrun \
    --fname infra/skypilot/droid_dinov3_mfu_box_overlay.yaml \
    --require-env HF_TOKEN \
    --require-env WANDB_API_KEY
  snapshot="$JEPAWM_CKPT/$JEPAWM_RUN_ID/run_metadata/training_v1_snapshot.json"
  report="$JEPAWM_CKPT/$JEPAWM_RUN_ID/run_metadata/MFU_BOX.json"
  uv run --no-sync python infra/skypilot/mfu_box_report.py \
    --snapshot "$snapshot" \
    --output "$report"
